[theme]
base = "light"
primaryColor = "#5b4bdb"
backgroundColor = "#faf6ef"
secondaryBackgroundColor = "#f1ebe0"
textColor = "#25232b"
redColor = "#c5453e"
orangeColor = "#c98a1b"
greenColor = "#2f8f62"
violetColor = "#5b4bdb"
grayColor = "#6b6760"
borderColor = "#e4dccf"
baseRadius = "large"
font = "sans serif"

[server]
headless = true              # never try to open a browser or prompt for an email on a server
enableXsrfProtection = true
fileWatcherType = "none"     # no source watching in production
maxUploadSize = 1            # the app has no uploads; keep the limit minimal

[client]
toolbarMode = "minimal"      # hides the Deploy / developer menu for visitors
showErrorDetails = "none"    # never show stack traces to visitors

[browser]
gatherUsageStats = false
